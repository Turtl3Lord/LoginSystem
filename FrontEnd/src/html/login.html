<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Login Page</title>
   
</head>
<body>
    <!-- Modal para loading -->
    <div id="loadingModal" class="modal">
        <div class="modal-content">
            <div class="loading-spinner"></div>
            <p>Fazendo login...</p>
        </div>
    </div>
    
    <div class="container">
        <div class="loginContainer">
            <h2>LOGIN</h2>
            <p class="subtitle">Entre com suas credenciais</p>
            
            <form id="loginForm" style="width: 100%;">
                <div class="inputGroup">
                    <label class="inputLabel" for="email">E-mail</label>
                    <input 
                        class="inputField" 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="seu@email.com"
                        required
                    >
                </div>
                
                <div class="inputGroup">
                    <label class="inputLabel" for="password">Senha</label>
                    <input 
                        class="inputField" 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Digite sua senha"
                        required
                    >
                </div>
                
                <button class="loginButton btn-bg-blue" type="button" id="loginBtn">
                    Entrar
                </button>
                
                <div class="divider">
                    <span>ou</span>
                </div>
                
                <button class="loginButton bg-black" type="button" id="googleBtn">
                    Continuar com Google
                </button>
            </form>
            
            <div class="registerLink">
                Não tem uma conta? <a href="register.html">Cadastre-se</a>
            </div>
        </div>
    </div>
    
    <script type="module" src="../js/login/index.js"></script>
</body>
</html>
