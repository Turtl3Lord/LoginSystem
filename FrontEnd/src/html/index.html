<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Login Page</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Modal para loading -->
    <div id="loadingModal" class="modal">
        <div class="modal-content">
            <div class="loading-spinner"></div>
            <p>Logging in...</p>
        </div>
    </div>

    <div class="container">
        <div class="loginContainer">
            <h2>LOGIN</h2>
            <form id="loginForm">
                <div>
                    <label for="email">Email:</label>
                    <input class="inputField" type="text" id="email" name="email" required>
                </div>
                <div>
                    <label for="password">Password:</label>
                    <input class="inputField" type="password" id="password" name="password" required>
                </div>
                <div>
                    <button class="loginButton btn-bg-blue" type="button" id="loginBtn">Login</button>
                    <button class="loginButton bg-black" type="button" id="googleBtn">Google</button>
                </div>
                <div>
                    <p style="color: rgb(137, 137, 137);">Don't have an account? <a href="register.html">Register here</a></p>
                </div>
            </form>
        </div>
    </div>
<script type="module" src="../js/login/index.js"></script>
</body>

</html>
